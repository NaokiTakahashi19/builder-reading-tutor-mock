<script>

const names=['問題を選ぶ','相談を選ぶ','場面・根拠を確かめる','考え方のヒント','ノートを撮影する','読み取り結果とアドバイス','終了'];
const passages={dialogue:{title:'空港での会話',kind:'対話文',source:'BUILDER受験版 英語 · p.5 発展問題 大問1',scene:'空港で、係官とMikeが話しています。',lines:[

{id:'purposeA',speaker:'Mike',text:'Sightseeing.'},

const items={
 handing:{page:'5',major:'1',minor:'1',passage:'dialogue',title:'物を渡す場面を読む',question:'①に最もよく合う1語を書きなさい。',wordCount:1,answers:['are'],evidence:['passport'],context:['passport','hand'],hint:'係官が何を頼んでいるかに注目してみよう。',prompts:[['係官に頼まれて、Mikeは何をしようとしているかな？','相手の依頼とSure.という返答をつなげて読んでみよう。'],['パスポートを差し出す場面だと分かったね。物を渡すとき、どんな言い方をするかな？','Here youまで書かれているね。場面に合う表現を思い出してみよう。'],['物を渡して「はい、どうぞ」と言う場面だね。残りの1語は何かな？','知っている表現を口に出して、Here youに続く形を確かめてみよう。']],success:'パスポートを見せてほしいという依頼と、物を渡す返答を結びつけられたね。',retry:'物を渡すときの言い方になっているかな？ Here youの後に続く1語を見直してみよう。'},
 purpose:{page:'5',major:'1',minor:'2',passage:'dialogue',title:'返答から質問の意図を読む',question:'②に最もよく適する文を、次から1つ選び、記号で答えなさい。',options:["What’s the matter?","What’s your hobby?","What’s the purpose of your visit?","What are you doing now?"],answer:2,evidence:['purposeA'],context:['purposeQ','purposeA'],hint:'空欄のすぐ後にある、Mikeの返答に注目してみよう。',prompts:[['Mikeの返答は、何について答えているかな？','質問と返答を一組として読んでみよう。'],['これは普段の趣味の話かな？ 今回、日本に来た目的の話かな？','空港で、到着した人が係官に答えている場面も手がかりになるよ。'],['訪問の目的に答えていると考えると、どんな質問なら自然につながるかな？','選択肢を空欄に入れて、Mikeの返答とかみ合うか確かめよう。']],success:'空港での場面と直後の返答を結びつけて、訪問の目的を尋ねる質問を選べたね。',wrong:['困っていることを尋ねる質問に、この返答は自然につながるかな？','普段の趣味と今回の訪問目的を区別してみよう。','','今している動作と今回来た目的では、どちらについて答えているかな？']},
 duration:{page:'5',major:'1',minor:'3',passage:'dialogue',title:'滞在期間を読み取る',question:'③に最もよく適する語を、次から1つ選び、記号で答えなさい。',options:['day','week','month','year'],answer:1,evidence:['durationA'],context:['durationQ','durationA'],hint:'二つの場所で、それぞれ何日過ごす予定かを読んでみよう。',prompts:[['仙台と松島には、それぞれ何日いる予定かな？','One (③).の後に、滞在期間を具体的に説明する文が続いているね。'],['二つの場所の日数を合わせると、全部で何日になるかな？','一つの場所だけの日数ではなく、旅行全体の日数を考えてみよう。'],['合計の日数を、Oneに続く期間の単位で表すとどうなるかな？','合計と同じ長さになる単位を、選択肢から探してみよう。']],success:'二つの場所の滞在日数を合計し、同じ長さの期間を表す語を選べたね。',wrong:['一方の場所だけでも1日より長いね。二つの滞在日数を合わせて考えてみよう。','','具体的な日数の合計が、1か月と同じ長さになるかな？','具体的な日数の合計が、1年と同じ長さになるかな？']},
 thanks:{page:'5',major:'1',minor:'4',passage:'dialogue',title:'お礼への返答を読む',question:'④に最もよく適する英語を、2語で書きなさい。',wordCount:2,answers:["you're welcome"],evidence:['thanks'],context:['thanks','welcome'],hint:'直前にMikeが何を伝えているかに注目してみよう。',prompts:[['Mikeの最後の発言は、お礼かな？ 依頼かな？','まず、その発言が相手に何を伝えるものかを考えよう。'],['お礼を言われた場面だと分かったね。係官は、どんな気持ちで返せば自然かな？','新しい質問ではなく、お礼を受け止める返事を考えてみよう。'],['「どういたしまして」に当たる言い方を、2語で表せるかな？','知っている表現を思い出して、語数の条件にも合っているか確かめよう。']],success:'お礼を伝える発言を受けて、自然な返答を2語で書けたね。',retry:'お礼を受け止める返答になっているかな？ つづりと2語の条件も確かめてみよう。'},
 firstVisit:{page:'5',major:'1',minor:'5',passage:'dialogue',title:'本文を根拠に英語で答える',question:'対話文の内容について、次の問いに英語で答えなさい。Is this Mike’s first visit to Japan?（3語）',wordCount:3,answers:['yes it is'],evidence:['first','yes'],context:['first','yes'],hint:'本文の中で、初めての訪問かどうかを確かめているやり取りを読んでみよう。',prompts:[['係官の問いに対して、Mikeはどのように答えているかな？','本文の問いと、そのすぐ後の返答を一緒に読んでみよう。'],['本文から、初めての訪問かどうか判断できたかな？ その内容を、今の設問への返答にするとどうなるかな？','本文の短い返答を、設問で指定された3語に整えてみよう。'],['設問のthisを代名詞で受けるとき、何を使うかな？','最初の返事に、代名詞とbe動詞を続ける形を考えよう。3語になっているかも確かめてみよう。']],success:'本文の返答を根拠に内容を判断し、設問に合う3語の返事にできたね。',retry:'本文でMikeが肯定しているか否定しているかを確かめよう。そのうえで、thisを受ける代名詞とbe動詞を見直してみよう。'}

let screen='home',page='',major='',itemId='',choice=-1,written='',hintLevel=0,selectedLines=[],selectionMessage='',selectionAccepted=false,sceneChoice=-1;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>items[itemId];
const normalize=t=>t.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[,.!?]/g,'').replace(/\s+/g,' ');
const isCorrect=()=>current().options?choice===current().answer:current().answers.includes(normalize(written));
function optionList(q){return q.options?`<ol class="reading-options">${q.options.map((x,i)=>`<li><span class="option-key">${'アイウエ'[i]}</span><span lang="en">${esc(x)}</span></li>`).join('')}</ol>`:`<p class="word-count">英語で${q.wordCount}語</p>`}
function responseText(){const q=current();if(isCorrect())return '正解です。'+q.success;if(q.options)return choice<0?'読み取った記号を確認してみよう。ア・イ・ウ・エのどれかな？':q.wrong[choice];const count=written.trim().split(/\s+/).length;if(count!==q.wordCount)return `設問は${q.wordCount}語で答える問題だね。内容を考えたうえで、語数も確かめてみよう。`;return q.retry}
function button(label,action,cls='primary'){return `<button type="button" class="${cls}" data-action="${action}">${label}</button>`}
function problem(){const q=current(),focusThis=screen==='question'&&itemId==='firstVisit'&&hintLevel===2;return `<section class="problem ${focusThis?'highlight':''}" aria-label="設問と選択肢"><small>p.5 発展問題　大問${q.major}（${q.minor}） · ${q.title}</small><h2 class="reading-question">${markPhrases(q.question,focusThis?['this']:[])}</h2>${optionList(q)}</section>`}
function fields(){return `<div class="fields"><label for="page">ページ<select id="page"><option value="">選ぶ</option><option value="5" ${page==='5'?'selected':''}>p.5</option></select></label><label for="major">大問<select id="major" ${!page?'disabled':''}><option value="">選ぶ</option>${page?`<option value="1" ${major==='1'?'selected':''}>1</option>`:''}</select></label><label for="item">小問<select id="item" ${!major?'disabled':''}><option value="">選ぶ</option>${Object.keys(items).filter(k=>items[k].page===page&&items[k].major===major).map(k=>`<option value="${k}" ${itemId===k?'selected':''}>（${items[k].minor}）</option>`).join('')}</select></label></div>`}
// Highlight only the phrase needed by the current question, preserving the rest of the dialogue.
const hintSpans={

 duration:[{durationA:['Two days','five days']},{durationA:['Two days','five days']},{durationA:['One (③)']}],
 thanks:[{thanks:['Thank you']},{thanks:['Thank you']},{thanks:['Thank you']}],

};
function markPhrases(text,phrases=[]){const ranges=phrases.map(phrase=>({start:text.indexOf(phrase),length:phrase.length})).filter(r=>r.start>=0).sort((a,b)=>a.start-b.start);let html='',offset=0;for(const r of ranges){if(r.start<offset)continue;html+=esc(text.slice(offset,r.start))+'<mark>'+esc(text.slice(r.start,r.start+r.length))+'</mark>';offset=r.start+r.length}return html+esc(text.slice(offset))}
function passage(highlight=false,level=-1){const q=current(),p=passages[q.passage];const spans=highlight?hintSpans[itemId][Math.max(0,level)]:{};const picking=screen==='clue'&&teaching[itemId].mode==='evidence';
return `<section class="passage ${highlight?'highlight':''}" aria-label="対話文の全文"><div class="passage-heading"><span>対話文（全文）</span><strong>${p.title}</strong><span>${picking?'発言をタップして選ぶ（複数可）':'上下にスクロールして読めます'}</span></div><div class="passage-lines" lang="en">${p.lines.map(line=>{const text=markPhrases(line.text,spans[line.id]);return `<div class="passage-line ${selectedLines.includes(line.id)&&picking?'chosen-line':''}" data-line="${line.id}"><span class="speaker">${line.speaker}</span>${picking?`<button type="button" class="line-content pick-line" data-select-line="${line.id}" aria-pressed="${selectedLines.includes(line.id)}" aria-label="${line.speaker}: ${esc(line.text)}">${text}</button>`:`<span class="line-content">${text}</span>`}</div>`}).join('')}</div></section>`}
function helpButtons(){return `<nav class="help-dock" aria-label="学習サポート"><div class="help-list">${[['?','先生と一緒に考える','start-teaching'],['▣','ノートの答えを確認','answer']].map(([symbol,label,action])=>`<button type="button" class="help" data-action="${action}"><span class="symbol" aria-hidden="true">${symbol}</span><strong>${label}</strong></button>`).join('')}</div></nav>`}
function coach(){const q=current(),t=teaching[itemId],thinking=screen==='question',last=hintLevel===q.prompts.length-1;return `<section class="coach" aria-label="先生と一緒に考える"><div class="coach-top"><span class="teacher">AIチュータ · ${t.type}</span><button type="button" class="close" data-action="help" aria-label="先生との対話を閉じる">×</button></div><div class="coach-copy" role="status"><h2>${thinking?q.prompts[hintLevel][0]:t.ask}</h2><p>${thinking?q.prompts[hintLevel][1]:t.guide}</p>${!thinking&&t.mode==='scene'?`<div class="scene-choices">${t.choices.map((label,i)=>`<button type="button" class="scene-choice" data-scene-choice="${i}" aria-pressed="${sceneChoice===i}">${label}</button>`).join('')}</div>`:''}${!thinking&&selectionMessage?`<p class="selection-feedback">${selectionMessage}</p>`:''}</div><div class="row hint-actions">${thinking?`${button('わかった','done')}<button type="button" class="secondary" data-action="more" ${last?'disabled':''}>もう少しヒント</button>`:selectionAccepted?button('この手がかりで考える','continue-thinking'):t.mode==='evidence'?`<button type="button" class="primary" data-action="judge-lines" ${!selectedLines.length?'disabled':''}>選んだ文を確かめる${selectedLines.length?'（'+selectedLines.length+'）':''}</button>`:''}</div></section>`}
const teaching={
 handing:{type:'会話表現',mode:'scene',ask:'Mikeは、係官に何をしようとしている場面かな？',guide:'係官の依頼と、Mikeの返事をつなげて考えてみよう。',choices:['パスポートを差し出す','自分の名前を伝える','滞在先を尋ねる'],correct:0,replies:['','名前について尋ねられているかな？ 係官が見せてほしいと言っている物を確かめよう。','滞在先の話より前の場面だね。最初の依頼に対して、Mikeは何をしているかな？'],success:'物を渡す場面だと考えたんだね。そのときの言い方を考えてみよう。',start:1},
 purpose:{type:'質問と返答のつながり',mode:'evidence',ask:'②の質問を考えるには、どの発言が手がかりになるかな？',guide:'本文の発言を選んでね。必要なら複数選べるよ。',required:['purposeA'],allowed:['purposeQ','purposeA'],partial:'質問を入れる場所を選んだね。その質問に対するMikeの返答も選べるかな？',retry:'②に入る質問を考えているね。それに対する返答が分かる発言を探し直してみよう。',success:'②に続く返答を見つけたね。次に、その返答が何を伝えているか考えよう。',start:0},
 duration:{type:'情報を組み合わせる',mode:'evidence',ask:'滞在期間を考えるには、どの文に注目すればいいかな？',guide:'日数が分かる文を選んでね。必要なら複数選べるよ。',required:['durationA'],allowed:['durationQ','durationA'],partial:'期間を尋ねる質問を見つけたね。それに答えている文も選べるかな？',retry:'今回は、旅行全体の期間を知りたいね。具体的な日数が分かる文をもう一度選んでみよう。',success:'二つの場所で過ごす日数を見つけたね。その情報を使って考えよう。',start:0},
 thanks:{type:'会話表現',mode:'scene',ask:'④の直前で、Mikeはどんな気持ちを伝えているかな？',guide:'会話の最後のやり取りを読んで、発言の意図を考えよう。',choices:['感謝している','お願いしている','謝っている'],correct:0,replies:['','何かを頼む言い方になっているかな？ 係官がパスポートを返した後の発言を読み直そう。','困ったことや失敗を謝る場面かな？ 最後のMikeの言葉は、どんなときに使うかな？'],success:'お礼を伝えていると考えたんだね。次は、それを受ける自然な返事を考えよう。',start:1},
 firstVisit:{type:'内容理解 → 英文で答える',mode:'evidence',ask:'初めての訪問かどうかは、どのやり取りから分かるかな？',guide:'何を尋ねているかと、その返答を一組にして選んでみよう。',required:['first','yes'],allowed:['first','yes'],partial:'問いだけでなく返答も、返答だけでなく何への返答かも必要だね。もう一方の発言を選べるかな？',retry:'今回は、初めて日本に来たかどうかを確かめたいね。その問いと返答を探してみよう。',success:'問いと返答を一緒に見つけたね。まず内容を確かめて、その後で3語の英文に整えよう。',start:0}
};
const lineMeanings={passport:'パスポートを見せてほしいという依頼',hand:'依頼に応じている返事',first:'初めての訪問かを尋ねる質問',yes:'直前の質問への短い返答',purposeQ:'質問を入れる空欄',purposeA:'訪問の目的についての返答',durationQ:'滞在期間についての質問',durationA:'二つの場所で過ごす日数',stayQ:'泊まる場所についての質問',stayA:'泊まる場所と相手についての返答',sights:'観光や食事についての案内',fish:'食事についての感想',returnPassport:'パスポートを返し、旅の挨拶をする発言',thanks:'会話の最後のMikeの発言',welcome:'最後の返答を入れる空欄'};
function resetTeaching(){selectedLines=[];selectionMessage='';selectionAccepted=false;sceneChoice=-1;hintLevel=0}
function toggleLine(id){if(screen!=='clue'||teaching[itemId].mode!=='evidence')return;const region=app.querySelector('.reading-pane'),scroll=region?region.scrollTop:0;selectedLines=selectedLines.includes(id)?selectedLines.filter(x=>x!==id):[...selectedLines,id];selectionMessage='';selectionAccepted=false;render();const restored=app.querySelector('.reading-pane');if(restored)restored.scrollTop=scroll;app.querySelector(`[data-select-line="${id}"]`)?.focus({preventScroll:true})}
function judgeLines(){const t=teaching[itemId];if(!selectedLines.length)return;const extra=selectedLines.find(id=>!t.allowed.includes(id));selectionAccepted=!extra&&t.required.every(id=>selectedLines.includes(id));selectionMessage=selectionAccepted?t.success:extra?`選んだ発言には、${lineMeanings[extra]}があるね。${t.retry}`:t.partial;const region=app.querySelector('.reading-pane'),scroll=region?region.scrollTop:0;render();if(region)app.querySelector('.reading-pane').scrollTop=scroll}
function chooseScene(index){sceneChoice=index;const t=teaching[itemId];selectionAccepted=index===t.correct;selectionMessage=selectionAccepted?t.success:t.replies[index];const region=app.querySelector('.reading-pane'),scroll=region?region.scrollTop:0;render();if(region)app.querySelector('.reading-pane').scrollTop=scroll}
const samples={handing:'is',purpose:'イ',duration:'ア',thanks:'Thank you',firstVisit:'Yes, he is.'};

function capture(){written=samples[itemId];choice=current().options?'アイウエ'.indexOf(written):-1;go('feedback')}

function focusEvidence(){const region=app.querySelector('.reading-pane'),mark=region?.querySelector('mark');if(region&&mark){region.scrollTop=Math.max(0,mark.getBoundingClientRect().top-region.getBoundingClientRect().top+region.scrollTop-region.clientHeight/3)}}
function go(next){if(next!=='home'&&!itemId){page='5';major='1';itemId='handing'}screen=next;render();window.scrollTo({top:0,behavior:'instant'});focusEvidence()}
function render(){let html='';const active=['help','clue','question','answer','feedback'].includes(screen),q=current();
if(screen==='home')html=`<p class="eyebrow">長文・対話文の読み取り</p><h1>どの問題で困っている？</h1><p class="sub">手元の教材を見て、ページ・大問・小問を選んでね。</p>${fields()}<p class="footnote entry-note">問題を選ぶと、設問・選択肢と本文が表示されます。<br>ノートが空欄のままでも、大丈夫。</p><div class="sample-note">今回の対象：p.5 発展問題・大問1（1）〜（5）</div>`;
if(active){let content='',actions='';if(screen==='answer'){content=camera();actions=`<div class="capture-actions">${button('← 本文に戻る','help','secondary')}${button('◉ 撮影する','capture')}</div>`}else if(screen==='feedback'){content=feedback();actions=`<div class="capture-actions">${button('撮り直す','answer','secondary')}${button('本文と一緒に考える','start-teaching')}</div>`}else{content=passage(screen==='question',screen==='question'?hintLevel:-1);actions=screen==='help'?helpButtons():coach()}
html=`<div class="study-screen"><div class="study-toolbar">${fields()}</div>${problem()}<div class="reading-pane ${screen==='answer'||screen==='feedback'?'capture-pane':''}" tabindex="0" aria-label="${screen==='answer'?'ノート撮影':screen==='feedback'?'読み取り結果とアドバイス':'対話文のスクロール領域'}">${content}</div>${actions}</div>`}
if(screen==='done')html=`<div class="finish center"><p class="paper-copy" style="color:var(--ink);font-size:18px">また分からなくなったら、<br>いつでもヒントを見に来てね。</p>${button('この問題のヒントに戻る','help')}<div style="margin-top:12px">${button('問題を選ぶ画面へ','reset','linkbutton')}</div></div>`;
app.innerHTML=html;const idx=states.indexOf(screen);document.getElementById('screen-label').textContent=names[idx];document.getElementById('screen-count').textContent=`${idx+1} / ${states.length}`;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===states.length-1}
function question(level=0){hintLevel=level;go('question')}
function act(a){if(a==='start-teaching'){resetTeaching();go('clue');return}if(a==='judge-lines'){judgeLines();return}if(a==='continue-thinking'){hintLevel=teaching[itemId].start;go('question');return}if(a==='capture'){capture();return}if(a==='more'){hintLevel=Math.min(hintLevel+1,current().prompts.length-1);go('question');return}if(a==='check'){const input=document.getElementById('ocr-answer');if(!input.value.trim())return;written=input.value.trim();choice=current().options?'アイウエ'.indexOf(written):-1;if(written.length!==1&&current().options)choice=-1;go('feedback');return}if(a==='reset'){page='';major='';itemId='';choice=-1;written='';resetTeaching();go('home');return}if(states.includes(a))go(a)}
document.addEventListener('change',e=>{const id=e.target.id;if(id==='page'){page=e.target.value;major='';itemId=''}else if(id==='major'){major=e.target.value;itemId=''}else if(id==='item'){itemId=e.target.value}else{return}choice=-1;written='';resetTeaching();screen=itemId?'help':'home';render();document.getElementById(id==='page'&&page?'major':id==='major'&&major?'item':id).focus()});
document.addEventListener('click',e=>{const line=e.target.closest('[data-select-line]');if(line){toggleLine(line.dataset.selectLine);return}const scene=e.target.closest('[data-scene-choice]');if(scene){chooseScene(Number(scene.dataset.sceneChoice));return}const btn=e.target.closest('[data-action]');if(btn&&!btn.disabled)act(btn.dataset.action)});
document.getElementById('prev').onclick=()=>go(states[Math.max(0,states.indexOf(screen)-1)]);
document.getElementById('next').onclick=()=>{const next=states[Math.min(states.length-1,states.indexOf(screen)+1)];if(next==='feedback'){capture();return}go(next)};
document.getElementById('reset').onclick=()=>act('reset');render();
</script>
</body></html>
